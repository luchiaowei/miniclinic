<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>統計資訊 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        .card { border: 1px solid #E2E8F0; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
    </style>
</head>
<body>
    <h1>統計資訊</h1>

    <div class="card">
        <strong>總掛號數：</strong> <span th:text="${total}">0</span>
    </div>

    <div class="card">
        <strong>近 7 天（含今日）掛號數：</strong> <span th:text="${last7}">0</span>
    </div>

    <div class="card">
        <h3>依狀態統計</h3>
        <table>
            <thead>
            <tr><th>狀態</th><th>數量</th></tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${statusCounts.entrySet()}">
                <td th:text="${entry.key}">BOOKED</td>
                <td th:text="${entry.value}">0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}">← 回首頁</a>
    </p>
</body>
</html>
